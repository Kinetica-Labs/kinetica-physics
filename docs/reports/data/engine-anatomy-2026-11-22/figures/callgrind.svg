  <g id="text_21">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #506275" x="39.744" y="50.6304" transform="rotate(-0 39.744 50.6304)">Сцена захвата на стенде Windows под WSL. Инструкции считает инструмент, кэш и предсказатель переходов моделируются.</text>
  </g>
  <g id="text_22">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #506275" x="38.88" y="383.10336" transform="rotate(-0 38.88 383.10336)">Итоги охватывают запуск, 27 сцен, 810 кадров и освобождение памяти. Каждый вариант проходит один инструментированный запуск.</text>
  </g>
  <g id="text_23">
