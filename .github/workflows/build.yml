name: build
on:
  push:
    branches: [main]
  pull_request:

jobs:
  physics:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Install build and proof dependencies
        run: sudo apt-get update && sudo apt-get install -y z3 clang
      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          cmake --build build --parallel 2
      - name: Test the release
        run: ctest --test-dir build --output-on-failure
      - name: Check code structure and documentation links
        run: python3 tests/code_metrics.py --check
